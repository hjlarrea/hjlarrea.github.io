<article class="project-card">
  <div class="project-card-topline">
    <span>{{ project.category }}</span>
    <span>{{ "%02d"|format(project.featured_order|int) }}</span>
  </div>
  <h3><a href="{{ SITEURL }}/{{ project.url }}">{{ project.title }}</a></h3>
  <p>{{ project.summary }}</p>
  <div class="project-card-footer">
    <span>{{ project.role }}</span>
    <a class="text-link" href="{{ SITEURL }}/{{ project.url }}" aria-label="Read the {{ project.title }} case study">Case study <span aria-hidden="true">→</span></a>
  </div>
</article>
